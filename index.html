  <!-- Metadata is handled dynamically by Helmet in components -->
  <title>BrowseQatar - Best Food Offers & Dining Deals in Qatar</title>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BrowseQatar",
      "url": "https://browseqatar.com",
      "description": "Discover the best food offers in Qatar today, including cheap food offers, family dinner buffet offers, and budget-friendly dining deals from top restaurants in Doha.",

        "@type": "Organization",
        "name": "BrowseQatar",
        "logo": {
          "@type": "ImageObject",
          "url": "https://browseqatar.com/bqLogo.jpg"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://browseqatar.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Top Food Offers in Qatar",
      "description": "A curated list of the best dining deals in Qatar including cheap food offers, buffet deals, and budget-friendly options from QAR 5 to 20.",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Low Price Food Offers in Qatar"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Family Dinner Buffet Offers"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Budget-Friendly Dining Options (QAR 5–20)"
        },
        {
          "@type": "ListItem",
          "position": 4,
          "name": "Best Restaurants in Qatar"
        },
        {
          "@type": "ListItem",
          "position": 5,
          "name": "Affordable Restaurants in Doha"
        }
      ]
    }
    </script>

</head>
